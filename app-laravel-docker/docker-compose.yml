services:
  # =========================================================================
  # PHP-FPM (Alpine) - Backend Laravel (AttendApp)
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendapp-app
    restart: unless-stopped
    working_dir: /var/www/html
    # CATATAN: container sengaja dijalankan sebagai ROOT (default).
    # Entrypoint akan memperbaiki permission storage & bootstrap/cache
    # (chown ke www-data) lalu PHP-FPM menurunkan privilege worker ke
    # www-data sesuai php/www.conf. Cara ini tahan terhadap perbedaan UID
    # di host dan mencegah error "Permission denied" saat mkdir.
    env_file:
      - .env.docker
    volumes:
      # Path kode Laravel. Default: repo `attendapp` sebagai folder SIBLING
      # dari `docker-ecosystem` (lihat README "Struktur Direktori").
      #   ~/projects/docker-ecosystem/app-laravel-docker/  ->  ../../attendapp
      #   ~/projects/attendapp/
      # Bila struktur folder Anda berbeda (mis. attendapp di dalam
      # docker-ecosystem), timpa lewat file `app-laravel-docker/.env`:
      #   LARAVEL_APP_PATH=../attendapp
      - ${LARAVEL_APP_PATH:-../../attendapp}:/var/www/html:delegated
    depends_on:
      - redis
    # laravel-network : dipakai antar-service dalam stack ini (app <-> nginx <-> redis).
    # shared-network  : dipakai reverse-proxy untuk mencapai PHP-FPM/nginx.
    #
    # ALIAS NETWORK (penting):
    # `aliases` mendaftarkan nama TAMBAHAN di DNS Docker. REVERSE PROXY hanya
    # mengetahui alias/nama yang terdaftar di shared-network. Karena itu service
    # PHP-FPM ini WAJIB punya alias `app`, sebab config nginx aplikasi memakai
    # `fastcgi_pass app:9000`.
    #
    # `container_name` TIDAK dipakai sebagai nama DNS, jadi jangan
    # mengandalkannya. Alias membuat penamaan tetap stabil walau service ini
    # nanti diganti nama.
    networks:
      laravel-network:
      shared-network:
        aliases:
          - app
          - attendapp-app
          - app-fpm

  # =========================================================================
  # Nginx (Alpine) - Web server untuk Laravel (FastCGI ke PHP-FPM via 9000)
  # =========================================================================
  laravel-nginx:
    image: nginx:alpine
    container_name: attendapp-nginx
    restart: unless-stopped
    volumes:
      - ${LARAVEL_APP_PATH:-../../attendapp}:/var/www/html:delegated
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    # laravel-network : nginx -> app:9000 (FastCGI).
    # shared-network  : tempat reverse-proxy mencapai service ini.
    #
    # WAJIB pakai alias `attendapp-nginx` (target `proxy_pass` di
    # reverse-proxy-docker/nginx/default.conf) DAN `laravel-nginx` (nama service
    # Compose, agar konsisten dengan perintah `docker compose up ... laravel-nginx`).
    # Tanpa alias `attendapp-nginx`, reverse proxy gagal dengan:
    #   attendapp-nginx could not be resolved (3: Host not found)
    networks:
      laravel-network:
      shared-network:
        aliases:
          - attendapp-nginx
          - laravel-nginx

  # =========================================================================
  # Redis (Alpine) - Cache & Session Store
  # CATATAN: `container_name` sengaja TIDAK dipakai. Nama container unik untuk
  # seluruh Docker host, sehingga kalau dipakai lagi oleh aplikasi lain (Redis
  # ini direncanakan dipakai bersama / sudah ada yang jalan), `docker compose up`
  # gagal dengan "Conflict. The container name is already in use".
  # Service tetap bisa diakses antar-container lewat nama service alias `redis`
  # di laravel-network -> REDIS_HOST=redis.
  # =========================================================================
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge
  shared-network:
    external: true
    name: shared-network

volumes:
  redis-data:
    driver: local