version: "3.8"

services:
  # =========================================================================
  # PHP-FPM (Alpine) - Backend Laravel
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    # Jalankan sebagai UID:GID yang sama dengan user di HOST/VPS (di Debian 12,
    # user pertama biasanya UID 1000). Tujuannya agar file yang DIBUAT Laravel
    # (log/upload/cache) tetap bisa dibaca & diedit dari sisi host.
    # Cek UID/GID Anda di VPS dengan: id -u && id -g
    user: "1000:1000"
    env_file:
      - .env.docker
    volumes:
      - ../laravel-test:/var/www/html:delegated
      - ./storage/logs:/var/www/html/storage/logs:delegated
    depends_on:
      - redis
    networks:
      - laravel-network
      - shared-network

  # =========================================================================
  # Nginx (Alpine) - Web server untuk Laravel (FastCGI ke PHP-FPM via 9000)
  # =========================================================================
  laravel-nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    volumes:
      - ../laravel-test:/var/www/html:delegated
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel-network
      - shared-network

  # =========================================================================
  # Redis (Alpine) - Cache & Session Store
  # =========================================================================
  redis:
    image: redis:alpine
    container_name: laravel-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge
  shared-network:
    external: true
    name: shared-network

volumes:
  redis-data:
    driver: local