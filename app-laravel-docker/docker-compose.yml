services:
  # =========================================================================
  # PHP-FPM (Alpine) - Backend Laravel (AttendApp)
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendapp-app
    restart: unless-stopped
    working_dir: /var/www/html
    # CATATAN: container sengaja dijalankan sebagai ROOT (default).
    # Entrypoint akan memperbaiki permission storage & bootstrap/cache
    # (chown ke www-data) lalu PHP-FPM menurunkan privilege worker ke
    # www-data sesuai php/www.conf. Cara ini tahan terhadap perbedaan UID
    # di host dan mencegah error "Permission denied" saat mkdir.
    env_file:
      - .env.docker
    volumes:
      # Path kode Laravel. Default: repo `attendapp` sebagai folder SIBLING
      # dari `docker-ecosystem` (lihat README "Struktur Direktori").
      #   ~/projects/docker-ecosystem/app-laravel-docker/  ->  ../../attendapp
      #   ~/projects/attendapp/
      # Bila struktur folder Anda berbeda (mis. attendapp di dalam
      # docker-ecosystem), timpa lewat file `app-laravel-docker/.env`:
      #   LARAVEL_APP_PATH=../attendapp
      - ${LARAVEL_APP_PATH:-../../attendapp}:/var/www/html:delegated
    depends_on:
      - redis
    networks:
      - laravel-network
      - shared-network

  # =========================================================================
  # Nginx (Alpine) - Web server untuk Laravel (FastCGI ke PHP-FPM via 9000)
  # =========================================================================
  laravel-nginx:
    image: nginx:alpine
    container_name: attendapp-nginx
    restart: unless-stopped
    volumes:
      - ${LARAVEL_APP_PATH:-../../attendapp}:/var/www/html:delegated
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel-network
      - shared-network

  # =========================================================================
  # Redis (Alpine) - Cache & Session Store
  # =========================================================================
  redis:
    image: redis:alpine
    container_name: attendapp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge
  shared-network:
    external: true
    name: shared-network

volumes:
  redis-data:
    driver: local