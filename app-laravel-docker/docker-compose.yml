services:
  # =========================================================================
  # PHP-FPM (Alpine) - Backend Laravel (AttendApp)
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendapp-app
    restart: unless-stopped
    working_dir: /var/www/html
    # CATATAN: container sengaja dijalankan sebagai ROOT (default).
    # Entrypoint akan memperbaiki permission storage & bootstrap/cache
    # (chown ke www-data) lalu PHP-FPM menurunkan privilege worker ke
    # www-data sesuai php/www.conf. Cara ini tahan terhadap perbedaan UID
    # di host dan mencegah error "Permission denied" saat mkdir.
    env_file:
      - .env.docker
    volumes:
      # Path kode Laravel. Default: repo `attendapp` sebagai folder SIBLING
      # dari `docker-ecosystem` (lihat README "Struktur Direktori").
      #   ~/projects/docker-ecosystem/app-laravel-docker/  ->  ../../attendapp
      #   ~/projects/attendapp/
      # Bila struktur folder Anda berbeda (mis. attendapp di dalam
      # docker-ecosystem), timpa lewat file `app-laravel-docker/.env`:
      #   LARAVEL_APP_PATH=../attendapp
      - ${LARAVEL_APP_PATH:-../../attendapp}:/var/www/html:delegated
    # CATATAN: tidak ada `depends_on: redis` lagi. Redis kini milik compose
    # terpisah (redis-shared-docker). Urutan start yang benar:
    #   db-postgres-docker -> redis-shared-docker -> app-laravel-docker
    # Entrypoint sudah menunggu PostgreSQL & Redis siap sebelum migrate.
    # shared-network : SATU-SATUNYA network. Dipakai untuk semua komunikasi:
    #   reverse-proxy -> laravel-nginx  (proxy_pass attendapp-nginx:80)
    #   laravel-nginx -> app            (fastcgi_pass app:9000)
    #   app           -> redis-shared   (REDIS_HOST=redis-shared)
    #   app           -> postgres-db    (DB_HOST=postgres-db)
    # Network terpisah seperti `laravel-network` TIDAK dipakai lagi supaya
    # konsisten dengan pola "semua compose memakai shared-network".
    #
    # ALIAS NETWORK (penting):
    # `aliases` mendaftarkan nama TAMBAHAN di DNS Docker. Nama yang bisa
    # di-resolve antar container hanyalah nama service Compose atau `aliases`,
    # BUKAN `container_name`. Service PHP-FPM ini WAJIB punya alias `app`,
    # sebab nginx aplikasi memakai `fastcgi_pass app:9000`.
    networks:
      shared-network:
        aliases:
          - app
          - attendapp-app
          - app-fpm

  # =========================================================================
  # Nginx (Alpine) - Web server untuk Laravel (FastCGI ke PHP-FPM via 9000)
  # =========================================================================
  laravel-nginx:
    image: nginx:alpine
    container_name: attendapp-nginx
    restart: unless-stopped
    volumes:
      - ${LARAVEL_APP_PATH:-../../attendapp}:/var/www/html:delegated
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    # shared-network : tempat reverse-proxy mencapai service ini.
    #
    # WAJIB pakai alias `attendapp-nginx` (target `proxy_pass` di
    # reverse-proxy-docker/nginx/default.conf) DAN `laravel-nginx` (nama service
    # Compose, agar konsisten dengan perintah `docker compose up ... laravel-nginx`).
    # Tanpa alias `attendapp-nginx`, reverse proxy gagal dengan:
    #   attendapp-nginx could not be resolved (3: Host not found)
    networks:
      shared-network:
        aliases:
          - attendapp-nginx
          - laravel-nginx

  # =========================================================================
  # CATATAN PENTING: service `redis` LOKAL DIHAPUS dari compose ini.
  #
  # Redis sekarang berdiri sendiri di `redis-shared-docker/` (pola sama seperti
  # `db-postgres-docker`) dan dipakai bersama beberapa aplikasi lewat
  # `shared-network` dengan nama `redis-shared`.
  #
  # Jalankan Redis-nya lebih dulu:
  #   cd ../redis-shared-docker && docker compose up -d
  #
  # Lalu di .env.docker aplikasi ini:
  #   REDIS_HOST=redis-shared
  #   REDIS_PASSWORD=<sama dengan redis-shared-docker/.env.docker>
  #   REDIS_DB / REDIS_CACHE_DB = nomor unik aplikasi ini
  #     (lihat tabel alokasi di redis-shared-docker/README.md)
  # =========================================================================

# Semua service memakai SATU network bersama `shared-network` (external).
# Dibuat sekali saja:  docker network create shared-network
networks:
  shared-network:
    external: true
    name: shared-network