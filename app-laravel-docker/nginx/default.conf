# ============================================================================
# Nginx - Web server untuk Laravel (container attendapp-nginx)
# Komunikasi dengan PHP-FPM (service "app":9000) via FastCGI
# ============================================================================

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Izinkan upload file cukup besar (bukti cuti, foto absensi, import Excel).
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # "app" = nama service PHP-FPM pada docker-compose (jangan pakai nama lama).
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Hindari timeout saat request berat (rekap absensi, export Excel/PDF).
        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # File statis langsung dari Nginx (lebih efisien daripada lewat PHP)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}