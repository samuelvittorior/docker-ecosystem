# ============================================================================
# Nginx - Web server untuk Laravel (container attendapp-nginx)
# Komunikasi dengan PHP-FPM (service "app":9000) via FastCGI
# ============================================================================

# ----------------------------------------------------------------------------
# Kompresi.
# Aplikasi ini mengirim ratusan file JS/CSS (total >14 MB mentah). Tanpa gzip,
# semua dikirim UTUH ke browser -- inilah penyebab terbesar "kerasa lambat"
# pada koneksi berlatensi tinggi (Indonesia -> VPS). Teks biasanya mengecil
# 65-80% setelah dikompresi.
# ----------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/x-font-ttf
    application/vnd.ms-fontobject
    font/ttf
    font/otf
    image/svg+xml;
# JANGAN kompresi gambar/video/arsip -- sudah terkompresi, malah membuang CPU.

# ----------------------------------------------------------------------------
# Skema asli request, diteruskan ke PHP-FPM.
#
# Rantai request: browser --https--> reverse-proxy --http--> nginx ini --FastCGI--> PHP.
# Di mata PHP, koneksi dari nginx ini SELALU http, jadi tanpa header di bawah,
# Laravel menganggap semua request http -> asset()/url() menghasilkan "http://"
# pada halaman https. Browser lalu memblokir CSS/JS ("Mixed Content") meskipun
# TrustProxies di aplikasi sudah '*' (header-nya belum pernah sampai ke PHP).
#
# reverse-proxy mengirim `X-Forwarded-Proto: https` untuk port 443 dan `http`
# untuk jalur lama (http://IP_VPS:8101), sehingga jalur IP tetap http.
# Kalau header tidak ada (request internal antar-container), default-nya http.
# ----------------------------------------------------------------------------
map $http_x_forwarded_proto $fastcgi_https {
    default  off;
    ~*^https on;
}

map $http_x_forwarded_proto $fastcgi_scheme {
    default  http;
    ~*^https https;
}

# Ukuran buffer FastCGI diperbesar: respons HTML besar (daftar absensi, rekap)
# jadi tidak ditulis ke file sementara di disk sebelum dikirim ke klien.
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
fastcgi_busy_buffers_size 32k;

# ----------------------------------------------------------------------------
# Upstream PHP-FPM dengan keep-alive.
#
# Tanpa ini nginx membuka koneksi TCP BARU ke PHP-FPM untuk SETIAP request
# (termasuk setiap aset dan setiap request API), jadi ada overhead handshake
# berulang. Dengan keepalive, koneksi dipakai ulang -> latensi lebih rendah.
#
# Nama service FPM adalah `app` (lihat aliases di docker-compose.yml).
# `keepalive 16` = simpan sampai 16 koneksi idle per worker.
# ----------------------------------------------------------------------------
upstream php-fpm {
    server app:9000;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Izinkan upload file cukup besar (bukti cuti, foto absensi, import Excel).
    client_max_body_size 64m;

    # Kirim file statis dengan sendfile (tanpa copy ke user-space) dan
    # tunda header sampai paket pertama siap (mengurangi jumlah paket kecil).
    sendfile on;
    tcp_nopush on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # "php-fpm" = upstream dengan keep-alive yang didefinisikan di atas
        # (sebelumnya: fastcgi_pass app:9000 -> koneksi baru tiap request).
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # --- Teruskan skema asli request ke PHP (perbaikan mixed content) -----
        # Ditempatkan SETELAH `include fastcgi_params` supaya menimpa nilai
        # bawaan ($https kosong -> "HTTPS" tidak dikirim, REQUEST_SCHEME=http).
        # `HTTPS` yang dibaca Laravel/Symfony, `HTTP_X_FORWARDED_PROTO` yang
        # dibaca TrustProxies, dan `HTTP_HOST` agar host (+port pada jalur
        # http://IP:8101) tetap benar saat Laravel menyusun URL absolut.
        fastcgi_param HTTPS                  $fastcgi_https;
        fastcgi_param REQUEST_SCHEME         $fastcgi_scheme;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_host if_not_empty;
        fastcgi_param HTTP_HOST              $http_host;
        # Wajib untuk upstream keepalive: tanpa ini nginx mengirim
        # `Connection: close` sehingga koneksi tetap ditutup tiap request.
        fastcgi_keep_conn on;
        # Hindari timeout saat request berat (rekap absensi, export Excel/PDF).
        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # File statis langsung dari Nginx (lebih efisien daripada lewat PHP)
    #
    # CATATAN PENTING soal header Cache-Control:
    # Sebelumnya di sini dipakai "public, no-transform". Direktif `no-transform`
    # melarang proxy/CDN mengubah isi respons -- TERMASUK mengompresinya.
    # Karena itu header diganti menjadi `immutable` (aman untuk aset yang
    # namanya memuat versi/hash) agar Cloudflare/CDN di depan boleh
    # mengompresi & meng-cache aset ini.
    #
    # `expires 30d` DIHAPUS karena ia juga mengirim header Cache-Control
    # sendiri -> hasilnya dua header Cache-Control yang saling bertentangan.
    # Cukup satu header di bawah ini.
    #
    # Header keamanan diulang di sini: di nginx, `add_header` pada level
    # location MENGGANTIKAN (bukan menambah) `add_header` dari level server.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
}