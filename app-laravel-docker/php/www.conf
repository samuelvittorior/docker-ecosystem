[www]

user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data
; listen.allowed_clients dibiarkan nonaktif agar container Nginx (laravel-nginx)
; dapat terhubung ke PHP-FPM via TCP di network Docker.
; listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 15
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

pm.status_path = /fpm-status
ping.path = /ping

request_terminate_timeout = 300
request_slowlog_timeout = 0

slowlog = /var/log/php-fpm-slow.log

php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 50M
php_admin_value[error_reporting] = E_ALL
php_admin_flag[log_errors] = on

; Session ditangani oleh LARAVEL (SESSION_DRIVER=redis di .env.docker), bukan
; oleh session handler bawaan PHP. Baris php_value[session.save_handler] dan
; session.save_path sengaja TIDAK dipakai karena:
;   1. Host Redis kini milik compose terpisah (redis-shared), dan
;   2. session.save_path tidak bisa diisi dari environment variable, sehingga
;      nama host harus di-hardcode (rawan putus saat topologi berubah).
; Jika suatu saat butuh PHP native session, isi manual, mis.:
;   php_value[session.save_handler] = redis
;   php_value[session.save_path] = "tcp://redis-shared:6379?auth=PASSWORD"

; -----------------------------------------------------------------------------
; Output error.
; display_errors dimatikan agar pesan error tidak bocor ke halaman production.
; catch_workers_output=yes membuat output PHP-FPM (termasuk warning OPcache)
; muncul di `docker compose logs app`, bukan hilang begitu saja.
; -----------------------------------------------------------------------------
php_admin_flag[display_errors] = off
catch_workers_output = yes
