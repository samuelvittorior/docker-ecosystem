# =============================================================================
# redis.conf - Konfigurasi Redis bersama (AttendApp & aplikasi lain)
# Dimuat oleh redis-shared-docker/docker-compose.yml
#
# Catatan: `requirepass` TIDAK ditulis di sini, melainkan diberikan lewat
# command-line/ENV di compose agar password tidak tersimpan di file yang
# ter-commit ke git.
# =============================================================================

# --- Jaringan -----------------------------------------------------------------
# Hanya menerima koneksi dari network Docker (bukan dari internet). Port tidak
# dipublikasikan ke host, jadi ini lapis pengaman tambahan.
bind 0.0.0.0
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300

# --- Memori -------------------------------------------------------------------
# maxmemory & policy diisi dari docker-compose (ENV REDIS_MAXMEMORY).
# `noeviction` PENTING: dengan policy ini Redis MENOLAK penulisan baru ketika
# memori penuh, bukan diam-diam membuang key.
#
# Alternatif `allkeys-lru` memang tidak akan pernah "kehabisan memori", tetapi
# berisiko MENGHAPUS SESSION pengguna (session kita disimpan di Redis) sehingga
# user tiba-tiba logout. Karena Redis ini dipakai bersama beberapa aplikasi,
# kejutan seperti itu lebih merugikan daripada sesekali gagal menulis cache.
maxmemory-policy noeviction
maxmemory-samples 5

# --- Persistensi (AOF) --------------------------------------------------------
# AOF membuat session bertahan saat container di-restart.
#   appendfsync everysec : trade-off aman & cepat (kehilangan maks 1 detik).
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
dir /data

# --- Logging ------------------------------------------------------------------
loglevel notice
# Log ke stdout agar terbaca lewat `docker compose logs redis`.
logfile ""

# --- Keamanan -----------------------------------------------------------------
# Perintah berbahaya dinonaktifkan. `FLUSHALL`/`FLUSHDB` berbahaya pada Redis
# BERSAMA: satu aplikasi bisa menghapus seluruh cache aplikasi lain.
# Untuk maintenance yang memang perlu menghapus data, pakai redis-cli:
#   docker exec -it redis-shared sh -c 'redis-cli -a "$REDIS_PASSWORD" --scan --pattern "app_*"'
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_9f3a1c"
