; OPcache Configuration - ItemMonitoring (Laravel 10.50) di VPS bersama 4 aplikasi
;
; Catatan: JANGAN tambahkan "zend_extension=opcache" di sini.
; "docker-php-ext-install opcache" pada Dockerfile sudah mengaktifkannya lewat
; /usr/local/etc/php/conf.d/docker-php-ext-opcache.ini. Menambahkannya lagi
; memicu warning "Cannot load Zend OPcache - it was already loaded".
;
; NILAI DI SINI DIPERKECIL dari app-laravel-docker (256 MB) karena VPS ini
; menjalankan 4 aplikasi PHP sekaligus: AttendApp 256 + ITHelper 128 +
; ItemMonitoring 128 = 512 MB OPcache. Direktifnya SAMA dengan AttendApp;
; yang berbeda hanya ukuran memori, menyesuaikan jumlah aplikasi.

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=15000
opcache.max_wasted_percentage=10

; Production: file PHP dianggap tidak pernah berubah (lebih cepat).
; Konsekuensinya WAJIB: setiap kali kode di-deploy -> recreate container,
; bukan cuma reload. Tanpa recreate, kode lama tetap dipakai dari RAM.
;   docker compose up -d --force-recreate imon-app
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.fast_shutdown=1
opcache.enable_file_override=1

; Simpan komentar/docblock? Tidak perlu di production (hemat memori & waktu).
opcache.save_comments=1
