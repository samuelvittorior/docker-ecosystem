[www]

user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data
; listen.allowed_clients dibiarkan nonaktif agar container Nginx (imon-nginx)
; dapat terhubung ke PHP-FPM via TCP di network Docker.
; listen.allowed_clients = 127.0.0.1

; -----------------------------------------------------------------------------
; WAJIB: teruskan environment container ke worker PHP-FPM.
; Default PHP-FPM adalah `clear_env = yes` -> SEMUA environment variable dari
; Docker (env_file `.env.docker`) DIBUANG sebelum worker dijalankan. Akibatnya
; pada permintaan HTTP, Laravel hanya melihat isi ItemMonitoring/.env (nilai LOKAL:
; DB_HOST=127.0.0.1) sementara `php artisan ...` lewat `docker exec` (CLI)
; tetap melihat environment container. Gejalanya membingungkan: artisan
; melaporkan DB benar, tetapi halaman web 500 karena menembak 127.0.0.1 dari
; dalam container.
; -----------------------------------------------------------------------------
clear_env = no

; -----------------------------------------------------------------------------
; Alokasi worker.
;
; VPS ini menjalankan 4 aplikasi PHP: AttendApp (15 worker), ITHelper (8),
; ItemMonitoring (6) + PostgreSQL + Redis + 3 container nginx.
; Setiap worker PHP rata-rata memakai 30-60 MB, jadi total worker dibatasi agar
; tidak swap (penyebab paling umum "server terasa lambat").
;
; php-fpm hanya membuat worker sesuai beban (pm = dynamic), angka ini plafon:
;   max_children       = 6   -> plafon ~6 x 60MB = 360MB saat puncak
;   request_terminate  = 300 -> request lebih lama diputus
; -----------------------------------------------------------------------------
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

pm.status_path = /fpm-status
ping.path = /ping

request_terminate_timeout = 300
request_slowlog_timeout = 0

slowlog = /var/log/php-fpm-slow.log

php_admin_value[memory_limit] = 320M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 50M
php_admin_value[error_reporting] = E_ALL
php_admin_flag[log_errors] = on

; Session ditangani LARAVEL (SESSION_DRIVER=file), bukan session handler PHP.
; Aplikasi ini TIDAK memakai Redis, jadi tidak ada session.save_path ke Redis.

; -----------------------------------------------------------------------------
; Output error.
; display_errors dimatikan agar pesan error tidak bocor ke halaman production.
; catch_workers_output=yes membuat output PHP-FPM (termasuk warning OPcache)
; muncul di `docker compose logs imon-app`.
; -----------------------------------------------------------------------------
php_admin_flag[display_errors] = off
catch_workers_output = yes

; Error PHP darurat tetap dikirim ke stderr container (terlihat di docker logs).
php_admin_value[error_log] = /proc/self/fd/2
