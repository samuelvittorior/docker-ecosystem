name: Deploy Infra - docker-ecosystem

# Workflow ini mengelola INFRASTRUKTUR (Docker Compose).
# Dijalankan otomatis setiap ada push ke branch main, atau manual dari tab Actions.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Cegah 2 deployment berjalan bersamaan
concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  validate:
    name: Validasi konfigurasi Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validasi YAML & Compose config
        run: |
          set -e
          for f in db-postgres-docker/docker-compose.yml \
                   redis-shared-docker/docker-compose.yml \
                   reverse-proxy-docker/docker-compose.yml \
                   app-laravel-docker/docker-compose.yml; do
            echo "==> Memeriksa $f"
            # docker compose config -q memvalidasi sintaks + resolusi env/network
            docker compose -f "$f" config -q || {
              echo "::error::Konfigurasi compose tidak valid: $f"; exit 1; }
          done
          echo "Semua konfigurasi compose valid."

      - name: Uji sintaks Nginx (config diuji SEBELUM deploy)
        run: |
          set -e
          # --add-host: beri IP dummy agar nama upstream statis (fastcgi_pass app:9000)
          # bisa di-resolve saat `nginx -t`. Tanpa ini nginx -t gagal dengan
          # "host not found in upstream" walau konfigurasinya benar.
          echo "==> reverse-proxy-docker/nginx/default.conf"
          # Folder extra di-mount karena default.conf memuat
          # `include /etc/nginx/extra/*.conf` (konfigurasi SSL opsional hasil
          # tools/enable-https.sh). Tanpa mount, folder itu tidak ada di
          # container dan `nginx -t` bisa gagal.
          docker run --rm \
            --add-host attendapp-nginx:127.0.0.1 \
            -v "$PWD/reverse-proxy-docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/reverse-proxy-docker/nginx/extra:/etc/nginx/extra:ro" \
            -v "$PWD/reverse-proxy-docker/nginx/certs:/etc/nginx/certs:ro" \
            nginx:alpine nginx -t

          echo "==> app-laravel-docker/nginx/default.conf"
          docker run --rm \
            --add-host app:127.0.0.1 \
            -v "$PWD/app-laravel-docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Cek file wajib
        run: |
          set -e
          required="app-laravel-docker/Dockerfile
          app-laravel-docker/entrypoint.sh
          app-laravel-docker/nginx/default.conf
          app-laravel-docker/php/www.conf
          app-laravel-docker/php/opcache.ini
          db-postgres-docker/postgres/conf.d/shared-buffer.sql
          db-postgres-docker/postgres/conf.d/10-attendapp-user-db.sql
          redis-shared-docker/redis/redis.conf
          reverse-proxy-docker/nginx/default.conf
          reverse-proxy-docker/nginx/extra/attendapp-ssl.conf.example
          tools/perf-check.sh
          tools/enable-https.sh"
          for f in $required; do
            [ -f "$f" ] || { echo "::error::File wajib tidak ditemukan: $f"; exit 1; }
          done
          echo "Semua file wajib tersedia."

  deploy:
    name: Deploy infra ke VPS
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          INFRA_PATH: ${{ secrets.VPS_INFRA_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          envs: INFRA_PATH
          script: |
            set -e
            echo "==> Memastikan shared-network tersedia"
            docker network inspect shared-network >/dev/null 2>&1 || docker network create shared-network

            echo "==> Masuk ke folder infra: $INFRA_PATH"
            cd "$INFRA_PATH"

            echo "==> Menarik perubahan terbaru"
            git fetch --all --prune
            git pull --ff-only origin main

            echo "==> Memeriksa .env.docker di setiap service"
            for svc in app-laravel-docker db-postgres-docker redis-shared-docker reverse-proxy-docker; do
              if [ ! -f "$svc/.env.docker" ]; then
                echo "::error::$svc/.env.docker belum ada di VPS. File ini ikut ter-commit; jalankan 'git pull' lalu cek kembali."
                exit 1
              fi
            done

            echo "==> Validasi compose"
            docker compose -f db-postgres-docker/docker-compose.yml config -q
            docker compose -f redis-shared-docker/docker-compose.yml config -q
            docker compose -f reverse-proxy-docker/docker-compose.yml config -q
            docker compose -f app-laravel-docker/docker-compose.yml config -q

            echo "==> 1/4 Menjalankan PostgreSQL"
            (cd db-postgres-docker && docker compose up -d)

            echo "==> 2/4 Menjalankan Redis bersama"
            # --force-recreate: redis.conf di-bind-mount, jadi perubahan config
            # tidak terbaca tanpa recreate container.
            (cd redis-shared-docker && docker compose up -d --force-recreate)

            echo "==> 3/4 Menjalankan Reverse Proxy"
            # --force-recreate: nginx TIDAK memuat ulang file config yang
            # di-bind-mount. Tanpa flag ini perubahan nginx/default.conf tidak
            # pernah aktif walaupun file di VPS sudah ter-update oleh git pull.
            (cd reverse-proxy-docker && docker compose up -d --force-recreate)

            echo "==> 4/4 Build & jalankan Laravel (app + nginx)"
            cd app-laravel-docker
            docker compose up -d --build --remove-orphans app laravel-nginx

            echo "==> Membersihkan image lama yang tidak terpakai"
            docker image prune -f

            echo "==> Status kontainer"
            docker compose ps
            echo "Deploy infra selesai."
