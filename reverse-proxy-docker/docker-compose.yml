services:
  # =========================================================================
  # Nginx Reverse Proxy - Subdomain Routing untuk banyak aplikasi
  # =========================================================================
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
      - "${PROXY_SSL_PORT:-443}:443"
      # Akses langsung tanpa domain (HTTP):
      #   http://<IP_VPS>:8101 -> AttendApp        (port container 8080)
      #   http://<IP_VPS>:8102 -> ITHelper         (port container 8081)
      #   http://<IP_VPS>:8103 -> ItemMonitoring   (port container 8082)
      # Nomor kiri = port HOST (bisa diubah lewat reverse-proxy-docker/.env.docker),
      # nomor kanan = port container yang dibaca `listen` di nginx/default.conf.
      # Jangan mengubah nomor KANAN tanpa mengubah blok `listen` yang cocok.
      - "${APP_HTTP_PORT:-8101}:8080"
      - "${ITHELPER_HTTP_PORT:-8102}:8081"
      - "${IMON_HTTP_PORT:-8103}:8082"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Konfigurasi opsional yang dimuat lewat `include /etc/nginx/extra/*.conf`
      # di akhir nginx/default.conf -- dipakai oleh tools/enable-https.sh untuk
      # mengaktifkan HTTPS/HTTP2 tanpa mengedit file utama.
      - ./nginx/extra:/etc/nginx/extra:ro
      # Webroot verifikasi Let's Encrypt (HTTP-01). Certbot menulis file
      # challenge ke folder ini, nginx menyajikannya di
      # /.well-known/acme-challenge/ -> perpanjangan sertifikat tanpa downtime.
      - ./nginx/certbot:/var/www/certbot:ro
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: shared-network