services:
  # =========================================================================
  # Nginx Reverse Proxy - Subdomain Routing untuk banyak aplikasi
  # =========================================================================
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: shared-network