services:
  # =========================================================================
  # Nginx Reverse Proxy - Subdomain Routing untuk banyak aplikasi
  # =========================================================================
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
      - "${PROXY_SSL_PORT:-443}:443"
      # Akses langsung tanpa domain: http://<IP_VPS>:8101 -> AttendApp
      # (port host 8101 -> port 8080 container, lihat nginx/default.conf)
      - "${APP_HTTP_PORT:-8101}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: shared-network