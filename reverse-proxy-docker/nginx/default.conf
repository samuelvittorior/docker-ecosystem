# =============================================================================
# Nginx Reverse Proxy - Subdomain Routing
# Dipakai bersama untuk banyak aplikasi Laravel
# =============================================================================

# Default - arahkan ke halaman default atau 404
server {
    listen 80 default_server;
    server_name _;
    return 200 'Reverse Proxy is running. Configure subdomains in nginx/default.conf.';
    add_header Content-Type text/plain;
}

# =============================================================================
# Contoh: app.laravel-test.com -> Laravel App (PHP-FPM via reverse proxy)
# =============================================================================
server {
    listen 80;
    server_name app.laravel-test.com *.laravel-test.com;

    location / {
        proxy_pass http://laravel-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File statis diteruskan ke Nginx internal aplikasi (laravel-nginx)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        proxy_pass http://laravel-nginx:80;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

