# =============================================================================
# HTTPS / HTTP2 (OPSIONAL) - diaktifkan hanya bila domain sudah siap.
#
# Blok SSL TIDAK ditulis di file ini, melainkan di file terpisah:
#   reverse-proxy-docker/nginx/extra/<domain>.conf
# dibuat otomatis dari template:
#   reverse-proxy-docker/nginx/extra/attendapp-ssl.conf.example
#
# Alasannya: `ssl_certificate` menunjuk file yang HARUS sudah ada saat nginx
# start. Bila blok SSL ditulis di sini sebelum sertifikat dibuat, nginx gagal
# start ("cannot load certificate") dan SEMUA domain di proxy ini ikut mati.
#
# Aktifkan dengan:
#   sudo bash tools/enable-https.sh attd.kovcc.web.id email@gmail.com
#
# Skrip memakai certbot mode WEBROOT (lewat port 80, lihat blok port 80 di
# atas): proxy tidak dimatikan, jadi tidak ada downtime - baik saat penerbitan
# maupun perpanjangan otomatis (tools/renew-https.sh).
#
# Hasil: https://<domain> (port 443) + http://<domain> dialihkan ke https.
# File *.example TIDAK pernah dimuat nginx.
# =============================================================================

# Dimuat paling akhir: folder ini berisi konfigurasi opsional (mis. hasil
# tools/enable-https.sh). `include` dengan pola wildcard TIDAK error bila
# tidak ada file yang cocok, jadi aman walau folder kosong.
include /etc/nginx/extra/*.conf;
