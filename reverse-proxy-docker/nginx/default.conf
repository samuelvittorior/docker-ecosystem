# =============================================================================
# HTTPS / SSL + HTTP/2 (OPSIONAL, diaktifkan hanya bila domain sudah ada).
#
# Blok SSL TIDAK ditulis di file ini, melainkan di file terpisah:
#   reverse-proxy-docker/nginx/extra/attendapp-ssl.conf.example
#
# Alasannya: `ssl_certificate` menunjuk file sertifikat yang HARUS sudah ada
# saat nginx start. Bila blok SSL ditulis di sini sebelum sertifikat dibuat,
# nginx gagal start ("cannot load certificate") dan SEMUA domain di proxy ini
# ikut mati. Dengan memisahkannya, konfigurasi ini tetap valid tanpa
# sertifikat, dan HTTPS diaktifkan dengan satu skrip:
#
#   bash tools/enable-https.sh app.attendapp.com email@contoh.com
#
# Skrip itu membuat sertifikat Let's Encrypt (certbot, mode --standalone),
# menyalinnya ke nginx/certs/, lalu menulis
#   nginx/extra/attendapp-ssl.conf   <- dimuat oleh baris `include` di bawah
# sehingga blok 443 + redirect http->https + HTTP/2 langsung aktif.
# File *.example TIDAK pernah dimuat nginx.
# =============================================================================

# Dimuat paling akhir: folder ini berisi konfigurasi opsional (mis. hasil
# tools/enable-https.sh). `include` dengan pola wildcard TIDAK error bila
# tidak ada file yang cocok, jadi aman walau folder kosong.
include /etc/nginx/extra/*.conf;