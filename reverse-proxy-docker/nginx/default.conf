# =============================================================================
# Nginx Reverse Proxy - Subdomain Routing
# Dipakai bersama untuk banyak aplikasi Laravel
# =============================================================================

# -----------------------------------------------------------------------------
# Resolver DNS internal Docker (embedded DNS server di 127.0.0.11).
#
# PENTING: tanpa ini nginx me-resolve nama upstream SEKALI SAAT START, sehingga
# bila container `attendapp-nginx` belum (atau sedang tidak) berjalan, seluruh
# reverse proxy gagal start dengan:
#   [emerg] host not found in upstream "attendapp-nginx"
# dan ikut mematikan SEMUA domain lain yang dilayani proxy ini.
#
# Dengan `resolver` + `proxy_pass` memakai VARIABEL ($attendapp_upstream),
# resolusi DNS ditunda ke saat request. Efeknya:
#   - reverse proxy selalu bisa start lebih dulu (urutan start tidak penting)
#   - app yang mati hanya menghasilkan 502 untuk domain itu saja
#   - container app yang restart & dapat IP baru terdeteksi maksimal 10 detik
# =============================================================================
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# -----------------------------------------------------------------------------
# Kompresi untuk HTML/aplikasi (JS/CSS sudah dikompresi oleh nginx aplikasi).
# `gzip_proxied any` WAJIB: tanpa itu nginx tidak mengompresi respons yang
# berasal dari upstream (dan semua respons di sini datang dari upstream).
# -----------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    image/svg+xml;

# -----------------------------------------------------------------------------
# Optimasi koneksi ke upstream.
# -----------------------------------------------------------------------------
# Keep-alive: nginx modern TIDAK bisa meng-cache DNS resolver + keepalive pool
# untuk upstream yang alamatnya berupa VARIABEL (syarat upstream keepalive
# adalah nama upstream yang di-resolve saat start). Karena itu keep-alive
# ditangani di nginx aplikasi (lihat `keepalive` di sana); di sini cukup
# dioptimalkan header & buffering:
#   - tcp_nodelay on : header/kecil tidak tertahan mekanisme Nagle -> respons
#                      lebih responsif untuk request kecil (API/JSON).
tcp_nodelay on;

# Buffer respons dari upstream. HTML aplikasi ini cukup besar (daftar absensi,
# rekap) -- buffer memadai membuat nginx tidak menulis ke file sementara di disk.
proxy_buffers 16 16k;
proxy_buffer_size 32k;
proxy_busy_buffers_size 32k;

# =============================================================================
# Template: catch-all untuk host yang tidak dikenal / tidak terdaftar.
#
# SEMENTARA DINONAKTIFKAN karena belum ada domain: blok Laravel di bawah yang
# menjadi "default_server", sehingga akses lewat IP publik tetap dilayani.
#
# Ketika sudah memakai lebih dari satu domain/aplikasi, aktifkan blok ini dan
# HAPUS kata "default_server" dari blok Laravel di bawah.
# =============================================================================
# server {
#     listen 80 default_server;
#     server_name _;
#     return 200 'Reverse Proxy is running. Configure subdomains in nginx/default.conf.';
#     add_header Content-Type text/plain;
# }

# =============================================================================
# Laravel App (AttendApp, dari app-laravel-docker) -> Nginx internal -> PHP-FPM
#
# Host yang dilayani:
#   app.attendapp.com     -> rencana produksi (setelah domain terdaftar)
#   *.attendapp.com       -> variasi subdomain lain
#   <IP_PUBLIK>           -> akses SEMENTARA tanpa domain
#   app.<IP>.nip.io       -> DNS wildcard gratis (mirip domain asli)
#   app.<IP>.sslip.io     -> alternatif DNS wildcard gratis
#
# "default_server" dipasang di sini agar request yang datang lewat IP publik
# (Host = <IP>) tetap dilayani walaupun tidak cocok server_name mana pun.
# =============================================================================
server {
    listen 80 default_server;
    server_name app.attendapp.com
                *.attendapp.com
                ~^[a-z0-9.-]+\.nip\.io$
                ~^[a-z0-9.-]+\.sslip\.io$
                _;

    # Nama upstream disimpan di variabel agar resolusi DNS terjadi saat request
    # (lihat penjelasan `resolver` di atas).
    set $attendapp_upstream "http://attendapp-nginx:80";

    # Batas ukuran upload. Default nginx hanya 1 MB -> upload foto absensi /
    # bukti cuti akan gagal 413. Samakan dengan client_max_body_size di
    # app-laravel-docker/nginx/default.conf.
    client_max_body_size 64m;

    location / {
        proxy_pass $attendapp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Request berat (rekap absensi, export Excel/PDF) butuh waktu lama.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # File statis diteruskan ke Nginx internal aplikasi (attendapp-nginx).
    # Kompresi + caching ditangani nginx aplikasi; di sini hanya meneruskan.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        proxy_pass $attendapp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}

# =============================================================================
# Akses langsung lewat PORT (tanpa domain & tanpa DNS wildcard):
#   http://<IP_VPS>:8101  ->  AttendApp
#
# Port host 8101 dipetakan ke port 8080 container ini (lihat `ports:` di
# docker-compose.yml). Dipisah dari blok port 80 supaya port 80 tetap bebas
# dipakai untuk domain/SSL aplikasi lain di kemudian hari.
#
# Catatan Host header: dipakai $http_host (BUKAN $host) karena $http_host
# menyertakan port. Tanpa port, Laravel men-generate URL tanpa ":8101" sehingga
# redirect/asset/form mengarah ke port 80 dan tampak "nyasar".
# =============================================================================
server {
    listen 8080 default_server;
    server_name _;

    set $attendapp_upstream "http://attendapp-nginx:80";

    client_max_body_size 64m;

    location / {
        proxy_pass $attendapp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        proxy_pass $attendapp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}

